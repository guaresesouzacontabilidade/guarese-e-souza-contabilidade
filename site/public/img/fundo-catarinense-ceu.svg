<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Céu claro do topo (com as ondas em movimento por cima, em js/site.js) -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf5ef"/>
    </linearGradient>
    <radialGradient id="verde" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#0a6b32" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0a6b32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="menta" cx="0.8" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#7fcf9c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7fcf9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vermelho" cx="0.95" cy="0.75" r="0.45">
      <stop offset="0" stop-color="#c0141f" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#c0141f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ceu)"/>
  <rect width="1600" height="900" fill="url(#verde)"/>
  <rect width="1600" height="900" fill="url(#menta)"/>
  <rect width="1600" height="900" fill="url(#vermelho)"/>
</svg>
