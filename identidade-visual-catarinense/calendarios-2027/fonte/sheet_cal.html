<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="covers.css"><style>
#sheet{width:1900px;padding:70px 80px 60px;box-sizing:border-box;font-family:Montserrat;background:linear-gradient(180deg,#eceded,#dcdee1)}
h1{margin:0;text-align:center;font-family:Cinzel;font-weight:700;font-size:52px;color:#07431f;letter-spacing:2px}
.sub{text-align:center;margin:10px 0 40px;font-size:16px;letter-spacing:7px;color:#8e0f16;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px 40px}
.card img{width:100%;display:block;border-radius:14px}
.cap{text-align:center;margin-top:8px;font-weight:700;font-size:20px;color:#1d2a22}
.cap span{display:block;font-weight:500;font-size:14px;color:#5b605c;margin-top:4px}
.bar{height:10px;margin:44px auto 0;width:220px;background:linear-gradient(180deg,#07431f 0 45%,#fff 45% 60%,#8e0f16 60%)}
</style></head><body><div id="sheet">
<h1>Calendários 2027</h1><div class="sub">CATARINENSE CONTABILIDADE E GESTÃO</div>
<div class="grid">
<div class="card"><img src="cal_mock/calendario-mesa-capa.png"><div class="cap">Mesa · capa<span>20 × 15 cm, wire-o no topo, 13 páginas</span></div></div>
<div class="card"><img src="cal_mock/calendario-mesa-janeiro.png"><div class="cap">Mesa · página do mês<span>Domingos e feriados em vermelho, feriados listados no mês</span></div></div>
<div class="card"><img src="cal_mock/calendario-parede-a3.png"><div class="cap">Parede · A3<span>Ano inteiro, feriados, contatos e QR code do site</span></div></div>
<div class="card"><img src="cal_mock/calendario-bolso.png"><div class="cap">Bolso · 9 × 5 cm<span>Frente com a logo e verso com o ano todo</span></div></div>
</div><div class="bar"></div></div></body></html>
