<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Notion · App da Lelé</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center;
        color: #fff; background: linear-gradient(160deg, #ff8ab0 0%, #d93a76 50%, #7a1e5c 100%);
      }
      main { max-width: 420px; }
      img { width: 76px; height: 76px; border-radius: 22px; box-shadow: 0 18px 40px -12px rgba(60, 0, 30, 0.55); }
      h1 { font-size: 30px; margin: 22px 0 8px; }
      p { font-size: 17px; line-height: 1.5; opacity: 0.95; margin: 0 0 12px; }
      .box { margin-top: 18px; padding: 14px 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.15); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/icons/icon.svg" alt="" />
      <h1 id="title">Notion conectado! 🎉</h1>
      <p id="text">Agora é só voltar para o App da Lelé.</p>
      <div class="box" id="hint">Pode fechar esta janela. No app, vá em Ajustes › Notion › Gerar cartões do Notion.</div>
    </main>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var erro = q.get('erro');
        var ws = q.get('ws');
        if (erro) {
          document.getElementById('title').textContent = erro === 'cancelado' ? 'Conexão cancelada' : 'Não deu certo desta vez';
          document.getElementById('text').textContent =
            erro === 'expirou' ? 'O pedido de conexão expirou. Volte ao app e toque em Conectar de novo.' :
            erro === 'cancelado' ? 'Tudo bem! Quando quiser, volte ao app e toque em Conectar.' :
            'Volte ao app e tente conectar de novo.';
          document.getElementById('hint').textContent = 'Pode fechar esta janela.';
        } else if (ws) {
          document.getElementById('text').textContent = 'Conectado a “' + ws + '”. Agora é só voltar para o App da Lelé.';
        }
      })();
    </script>
  </body>
</html>
