<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>App da Lelé</title>
    <meta name="description" content="Flashcards de medicina com repetição espaçada, feitos para a Lelé." />
    <meta name="theme-color" content="#fbf5f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lelé" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="preload" href="./assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/app.css" />
    <script>
      // Aplica o tema antes de desenhar a tela (sem "piscar").
      (function () {
        var pref = 'auto';
        try {
          pref = JSON.parse(localStorage.getItem('lele:prefs') || '{}').theme || 'auto';
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#170d13' : '#fbf5f2');
      })();
    </script>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--bg, #fbf5f2);
        transition: opacity 0.25s ease;
        z-index: 100;
      }
      .boot img {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        animation: boot 1.4s ease-in-out infinite;
      }
      @keyframes boot {
        50% {
          transform: scale(0.94);
          opacity: 0.7;
        }
      }
      .is-ready .boot {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <noscript><p style="padding: 24px; font-family: system-ui">O App da Lelé precisa de JavaScript ativado.</p></noscript>
    <div id="app"></div>
    <div class="boot" aria-hidden="true"><img src="./assets/icons/icon.svg" alt="" /></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
