<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="covers.css"><style>
body{margin:0;background:radial-gradient(ellipse at 50% 30%,#2e3032,#121314)}
#sheet{width:2000px;padding:80px 70px 70px;box-sizing:border-box;font-family:Montserrat;background:radial-gradient(ellipse at 50% 25%,#2e3032,#121314)}
h1{margin:0;text-align:center;font-family:Cinzel;font-weight:700;font-size:58px;letter-spacing:4px;
 background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;margin:12px 0 50px;font-size:16px;letter-spacing:8px;color:#cdbf9c;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.card img{width:100%;display:block;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px rgba(201,162,78,.25)}
.cap{text-align:center;margin-top:10px;font-weight:600;font-size:21px;color:#efe6cf;letter-spacing:.5px}
.cap span{display:block;font-weight:500;font-size:14px;color:#a9a294;margin-top:6px}
</style></head><body><div id="sheet">
<h1>Linha Executiva</h1><div class="sub">CADERNOS DE LUXO · CATARINENSE CONTABILIDADE E GESTÃO</div>
<div class="grid">
<div class="card"><img src="mock_lx/crop_lx1-imperial.png"><div class="cap">Imperial<span>Couro verde, costura e hot stamping dourado</span></div></div>
<div class="card"><img src="mock_lx/crop_lx2-noir.png"><div class="cap">Noir<span>Preto soft-touch, dourado e cantoneiras de metal</span></div></div>
<div class="card"><img src="mock_lx/crop_lx3-bordeaux.png"><div class="cap">Bordeaux<span>Couro vinho com placa de metal gravada</span></div></div>
<div class="card"><img src="mock_lx/crop_lx4-couture.png"><div class="cap">Couture<span>Lombada de couro verde e linho marfim</span></div></div>
</div></div></body></html>
